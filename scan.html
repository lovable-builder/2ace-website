<style>
  :root { --ink: #0B0C0E; --paper: #F5F4F1; --amber: #E39A2B; --line: rgba(11,12,14,0.14); --err: #B3392C; --ok: #2F7D55; }
  * { box-sizing: border-box; } html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.4 "IBM Plex Sans", system-ui, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: var(--ink); color: var(--paper); }
  .bar strong { flex: 1; font-family: Archivo, sans-serif; font-size: 18px; } .logo { font-family: Archivo, sans-serif; font-weight: 800; font-size: 20px; color: var(--amber); }
  .back { background: none; border: 0; color: var(--paper); font-size: 30px; line-height: 1; padding: 0 8px; } .out { color: rgba(245,244,241,.7); font-size: 13px; text-decoration: none; }
  main { padding: 16px; max-width: 560px; margin: 0 auto; padding-bottom: max(32px, env(safe-area-inset-bottom)); }
  .muted { color: rgba(11,12,14,.6); } .err { color: var(--err); }
  .msg { border-radius: 6px; font-weight: 600; } .msg.good, .msg.bad { padding: 12px 14px; margin: 0 0 14px; } .msg.good { background: rgba(47,125,85,.15); color: var(--ok); } .msg.bad { background: rgba(179,57,44,.14); color: var(--err); }
  .btn { font: inherit; font-weight: 700; background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 14px 22px; min-height: 48px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid rgba(11,12,14,.35); } .btn.big { flex: 1; min-height: 64px; font-size: 20px; background: var(--ok); } .btn.big.warn { background: var(--err); }
  .scanrow { display: flex; gap: 8px; margin: 0 0 16px; } .scan { flex: 1; min-width: 0; font: inherit; font-size: 20px; padding: 14px; border: 2px solid var(--ink); border-radius: 8px; background: #fff; }
  .qty { width: 110px; font: inherit; font-size: 24px; text-align: center; padding: 10px; border: 2px solid var(--ink); border-radius: 8px; }
  .tiles { display: grid; gap: 14px; } .tile { text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 22px; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px; } .tile b { font-family: Archivo, sans-serif; font-size: 26px; } .tile span { color: rgba(11,12,14,.6); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 0 0 16px; display: grid; gap: 10px; } .card b { font-size: 22px; } .row2 { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .list { display: grid; gap: 8px; margin: 0 0 16px; } .row { display: grid; text-align: left; gap: 2px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; font: inherit; width: 100%; cursor: pointer; } .row.static { cursor: default; } .row.done { border-color: var(--ok); background: rgba(47,125,85,.08); } .row small { color: rgba(11,12,14,.6); }
  .photo { display: grid; gap: 6px; } .photo input { font: inherit; font-size: 14px; }
  .pimg { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; background: #F5F4F1; }
  .row.now { border-color: var(--amber); border-width: 2px; } textarea { font: inherit; font-size: 16px; padding: 10px; border: 2px solid var(--ink); border-radius: 8px; width: 100%; background: #fff; }
  .hint { font-weight: 700; color: var(--amber); margin: 0 0 8px; }
  .cam { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column; } .cam video { flex: 1; width: 100%; object-fit: cover; } .cam .btn { margin: 16px; }
</style>
