<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | 2ACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0B0C0E; --paper: #F5F4F1; --amber: #E39A2B; --line: rgba(11,12,14,0.12); --err: #B3392C; --ok: #2F7D55; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1 { font-family: Archivo, sans-serif; font-variation-settings: 'wdth' 108; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; margin: 6px 0 16px; }
  h2 { font-family: Archivo, sans-serif; font-size: 18px; margin: 0 0 12px; }
  .muted { color: rgba(11,12,14,0.6); } .err { color: var(--err); margin: 6px 0; } .pad { padding: 24px; }
  small { font-size: 13px; }
  .mono { font-family: 'IBM Plex Mono', monospace; } .warnText { color: #8A5A10; } .tabs { margin: 0 0 12px; gap: 8px; } .tabs a { text-decoration: none; }
  .shell { min-height: 100vh; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--ink); color: var(--paper); }
  .top .logo { font-family: Archivo, sans-serif; font-variation-settings: 'wdth' 118; font-weight: 800; font-size: 21px; color: var(--paper); text-decoration: none; }
  .top .tag { font: 11px 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
  .top .sp { flex: 1; } .top .who { font-size: 13px; opacity: .8; } .top .pill { background: rgba(245,244,241,.15); color: var(--paper); }
  .top .btn.ghost { color: var(--paper); border-color: rgba(245,244,241,.35); }
  .body { display: flex; flex: 1; min-height: 0; }
  .side { width: 200px; flex: none; padding: 16px 10px; background: #14161A; display: flex; flex-direction: column; gap: 2px; }
  .side a { padding: 10px 12px; border-radius: 3px; color: rgba(245,244,241,.72); text-decoration: none; font-weight: 500; }
  .side a:hover { color: var(--paper); } .side a.on { background: rgba(245,244,241,.1); color: var(--paper); }
  .main { flex: 1; min-width: 0; padding: clamp(16px, 3vw, 36px); max-width: 1180px; }
  @media (max-width: 760px) { .body { flex-direction: column; } .side { width: auto; flex-direction: row; overflow-x: auto; padding: 8px; } .top .who { display: none; } }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 0 0 16px; } .row.between { justify-content: space-between; align-items: flex-start; } .row.end { justify-content: flex-end; }
  .grow { flex: 1; min-width: 200px; } .inline { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 18px; margin: 0 0 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .stat { display: flex; flex-direction: column; gap: 4px; padding: 18px; background: #fff; border: 1px solid var(--line); border-radius: 4px; text-decoration: none; color: inherit; }
  .stat b { font: 800 34px Archivo, sans-serif; } .stat span { color: rgba(11,12,14,.65); } .stat.hot { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
  input, select, textarea { font: inherit; padding: 10px 12px; border: 1px solid rgba(11,12,14,.25); border-radius: 3px; background: #fff; color: var(--ink); max-width: 100%; }
  textarea { width: 100%; resize: vertical; } input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(227,154,43,.25); }
  .field { display: flex; flex-direction: column; gap: 5px; margin: 0 0 12px; } .field > span { font: 11px 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: rgba(11,12,14,.55); }
  .btn { border: 0; cursor: pointer; padding: 11px 18px; border-radius: 3px; background: var(--amber); color: var(--ink); font: 500 12px 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; display: inline-block; }
  .btn:hover { background: #F0AE47; } .btn:disabled { opacity: .55; cursor: default; }
  .btn.ghost { background: transparent; border: 1px solid rgba(11,12,14,.3); } .btn.ghost:hover { border-color: var(--ink); } .btn.tiny { padding: 6px 10px; font-size: 11px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 10px; font: 11px 'IBM Plex Mono', monospace; letter-spacing: .06em; text-transform: uppercase; background: rgba(11,12,14,.08); }
  .pill.ok { background: rgba(47,125,85,.15); color: var(--ok); } .pill.warn { background: rgba(227,154,43,.22); color: #8A5A10; } .pill.bad { background: rgba(179,57,44,.14); color: var(--err); } .pill.muted { color: rgba(11,12,14,.6); }
  .tbl-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 4px; margin: 0 0 16px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; } .tbl th { text-align: left; padding: 10px 12px; font: 11px 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: rgba(11,12,14,.55); border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 10px 12px; border-bottom: 1px solid rgba(11,12,14,.07); vertical-align: top; } .tbl tr:last-child td { border-bottom: 0; }
  .tbl tr.click { cursor: pointer; } .tbl tr.click:hover td, .tbl tr.click:focus td { background: rgba(227,154,43,.08); outline: 0; } .tbl .empty { color: rgba(11,12,14,.5); text-align: center; padding: 24px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0 0 10px; } .kv dt { color: rgba(11,12,14,.6); } .kv dd { margin: 0; word-break: break-word; }
  .thread { display: flex; flex-direction: column; gap: 10px; margin: 0 0 16px; } .msg { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; } .msg.out { border-left: 3px solid var(--amber); } .msg.note { background: rgba(227,154,43,.1); border-style: dashed; }
  .msg-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 6px; } .msg-body { white-space: pre-wrap; }
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(11,12,14,.55); display: grid; place-items: center; padding: 16px; }
  .modal { width: 100%; max-width: 480px; background: var(--paper); border-radius: 6px; padding: 18px; max-height: 90vh; overflow: auto; } .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 17px; }
  .modal .x { border: 0; background: none; font-size: 26px; cursor: pointer; color: rgba(11,12,14,.6); } .modal-body > * { margin-bottom: 12px; } .modal-body select, .modal-body textarea { width: 100%; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 4px; } .toast.bad { background: var(--err); }
  .center { min-height: 100vh; display: grid; place-items: center; padding: 20px; } .auth-card { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 28px; } .auth-card > * { margin-bottom: 14px; } .auth-card input { width: 100%; }
  .qr { width: 200px; height: 200px; display: block; margin: 0 auto; border: 1px solid var(--line); }
</style>
</head>
<body>
<div id="app"><p class="muted pad">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="/assets/admin/app.js?v=4"></script>
</body>
</html>
