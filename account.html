<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account | 2ACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0B0C0E; --paper: #F5F4F1; --amber: #E39A2B; --err: #B3392C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px clamp(16px, 3vw, 32px); background: var(--ink); color: var(--paper); }
  header a { color: var(--paper); text-decoration: none; }
  .mark { font-family: Archivo, sans-serif; font-variation-settings: 'wdth' 118; font-weight: 800; font-size: 21px; letter-spacing: 0.02em; }
  .nav { display: flex; gap: 18px; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
  .nav button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--paper); font: inherit; letter-spacing: inherit; text-transform: inherit; text-decoration: underline; text-underline-offset: 3px; }
  main { max-width: 640px; margin: 0 auto; padding: 36px 16px 80px; }
  h1 { font-family: Archivo, sans-serif; font-variation-settings: 'wdth' 112; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { margin: 0 0 28px; color: rgba(11,12,14,0.66); font-size: 15px; }
  section { margin: 0 0 28px; padding: 24px; background: #fff; border: 1px solid rgba(11,12,14,0.12); border-radius: 3px; }
  h2 { font-family: Archivo, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; margin: 0 0 18px; }
  form { display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(11,12,14,0.6); }
  input, select { font: 15px 'IBM Plex Sans', sans-serif; letter-spacing: 0; text-transform: none; padding: 13px 14px; border: 1px solid rgba(11,12,14,0.25); border-radius: 2px; background: #fff; color: var(--ink); }
  input:focus, select:focus { outline: 0; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(227,154,43,0.25); }
  input:disabled, select:disabled { background: rgba(11,12,14,0.05); color: rgba(11,12,14,0.6); }
  .two { display: grid; grid-template-columns: 1fr 1.6fr; gap: 12px; }
  .go { justify-self: start; border: 0; cursor: pointer; padding: 14px 22px; border-radius: 2px; background: var(--amber); color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
  .go:hover { background: #F0AE47; }
  .go:disabled { opacity: 0.6; cursor: default; }
  .logo-row { display: flex; align-items: center; gap: 18px; margin: 0 0 14px; }
  .avatar { flex: none; display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; background: var(--amber) center / cover no-repeat; color: var(--ink); font-family: Archivo, sans-serif; font-weight: 800; font-size: 24px; border: 1px solid rgba(11,12,14,0.12); }
  .logo-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .ghost { border: 1px solid rgba(11,12,14,0.25); background: none; cursor: pointer; padding: 14px 18px; border-radius: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
  .msg { min-height: 20px; margin: 0; font-size: 14px; }
  .msg.err { color: var(--err); } .msg.ok { color: #2F7D55; }
  .note { margin: 0; font-size: 13px; color: rgba(11,12,14,0.6); }
</style>
</head>
<body>
<header>
  <a class="mark" href="/">2ACE</a>
  <div class="nav"><a href="/platform?view=dash">Dashboard</a><button type="button" id="logout">Log out</button></div>
</header>
<main id="main" hidden>
  <h1>Your account</h1>
  <p class="sub" id="who"></p>

  <section>
    <h2>Your details</h2>
    <form id="f-profile" novalidate>
      <label>Email<input id="p-email" type="email" disabled></label>
      <label>Full name<input id="p-name" type="text" autocomplete="name" required></label>
      <label>Phone<input id="p-phone" type="tel" autocomplete="tel"></label>
      <button class="go" type="submit">Save details</button>
      <p class="msg" id="m-profile" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section>
    <h2>Company logo</h2>
    <div class="logo-row">
      <div class="avatar" id="av" aria-label="Logo preview"></div>
      <div class="logo-actions">
        <input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        <button class="go" type="button" id="logo-pick">Upload logo</button>
        <button class="ghost" type="button" id="logo-del" hidden>Remove</button>
      </div>
    </div>
    <p class="note">PNG, JPG or WebP, up to 1 MB. Square or transparent logos look best. It shows in your dashboard avatar.</p>
    <p class="msg" id="m-logo" role="status" aria-live="polite"></p>
  </section>

  <section>
    <h2>Company</h2>
    <form id="f-org" novalidate>
      <p class="note" id="org-note" hidden></p>
      <label>Company name<input id="o-name" type="text" autocomplete="organization" required></label>
      <label>Country<select id="o-country" required></select></label>
      <label id="o-taxl">Tax / VAT number <input id="o-tax" type="text" autocomplete="off"></label>
      <label>Street and number<input id="o-addr" type="text" autocomplete="street-address"></label>
      <div class="two">
        <label>Postal code<input id="o-zip" type="text" autocomplete="postal-code"></label>
        <label>City<input id="o-city" type="text" autocomplete="address-level2"></label>
      </div>
      <label>Company phone<input id="o-phone" type="tel"></label>
      <button class="go" type="submit" id="org-save">Save company</button>
      <p class="msg" id="m-org" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section>
    <h2>Password</h2>
    <form id="f-pw" novalidate>
      <label>New password (min 8 characters)<input id="n-pw" type="password" autocomplete="new-password" minlength="8"></label>
      <button class="go" type="submit">Change password</button>
      <p class="msg" id="m-pw" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>

<script src="countries.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = window.supabase.createClient('https://hvbcmilcjragrcezwzlo.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2YmNtaWxjanJhZ3JjZXp3emxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNjMyODMsImV4cCI6MjEwNjYzOTI4M30.Q6TlQnDToz2oPr4FXNgKdgdrZT3ojUToCroLRVQGRsw');
  const $ = (id) => document.getElementById(id);
  const say = (id, text, kind) => { const el = $(id); el.textContent = text; el.className = 'msg ' + (kind || ''); };
  const nz = (v) => { v = v.trim(); return v === '' ? null : v; };
  let user = null, orgId = null, canEditOrg = false, logoPath = null, orgName = '';
  const LOGO_BASE = 'https://hvbcmilcjragrcezwzlo.supabase.co/storage/v1/object/public/logos/';

  function paintAvatar() {
    const av = $('av');
    const initials = orgName.split(/\s+/).filter(Boolean).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    if (logoPath) { av.style.backgroundImage = 'url(' + LOGO_BASE + encodeURI(logoPath) + ')'; av.style.backgroundColor = '#fff'; av.textContent = ''; }
    else { av.style.backgroundImage = 'none'; av.style.backgroundColor = ''; av.textContent = initials; }
    $('logo-del').hidden = !logoPath || !canEditOrg;
  }

  // Shrink to max 256px and re-encode as PNG (keeps transparency, keeps files tiny).
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, 256 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error('Could not process the image'))), 'image/png');
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not a valid image')); };
      img.src = url;
    });
  }

  $('logo-pick').onclick = () => $('logo-file').click();
  $('logo-file').addEventListener('change', async () => {
    const f = $('logo-file').files[0]; $('logo-file').value = '';
    if (!f || !orgId) return;
    if (!['image/png', 'image/jpeg', 'image/webp'].includes(f.type)) return say('m-logo', 'Use a PNG, JPG or WebP image.', 'err');
    if (f.size > 4 * 1024 * 1024) return say('m-logo', 'That file is too large. Pick one under 4 MB.', 'err');
    say('m-logo', 'Uploading...');
    try {
      const blob = await shrink(f);
      const path = orgId + '/logo-' + Date.now() + '.png';
      const up = await sb.storage.from('logos').upload(path, blob, { contentType: 'image/png', cacheControl: '31536000' });
      if (up.error) throw up.error;
      const { data, error } = await sb.from('organizations').update({ logo_path: path }).eq('id', orgId).select('id');
      if (error || !data || !data.length) { await sb.storage.from('logos').remove([path]); throw error || new Error('No permission to edit this company'); }
      const old = logoPath; logoPath = path; paintAvatar();
      if (old) await sb.storage.from('logos').remove([old]);
      say('m-logo', 'Logo updated.', 'ok');
    } catch (e) { say('m-logo', 'Could not upload: ' + (e.message || e), 'err'); }
  });
  $('logo-del').addEventListener('click', async () => {
    if (!logoPath || !confirm('Remove your logo?')) return;
    const { data, error } = await sb.from('organizations').update({ logo_path: null }).eq('id', orgId).select('id');
    if (error || !data || !data.length) return say('m-logo', 'Could not remove the logo.', 'err');
    await sb.storage.from('logos').remove([logoPath]); logoPath = null; paintAvatar(); say('m-logo', 'Logo removed.', 'ok');
  });

  fillCountrySelect($('o-country'), $('o-taxl'), $('o-tax'));

  $('logout').onclick = async () => { await sb.auth.signOut(); location.href = '/'; };

  async function load() {
    const { data: s } = await sb.auth.getSession();
    if (!s.session) { location.href = '/login?next=%2Faccount'; return; }
    user = s.session.user;
    $('who').textContent = 'Signed in as ' + user.email;
    $('p-email').value = user.email;

    const { data: p } = await sb.from('profiles').select('full_name, phone').eq('user_id', user.id).maybeSingle();
    $('p-name').value = (p && p.full_name) || '';
    $('p-phone').value = (p && p.phone) || '';

    const { data: m } = await sb.from('members').select('org_id, role, organizations(name, country, vat_id, address_line, city, postal_code, phone, logo_path)').eq('user_id', user.id).limit(1).maybeSingle();
    if (m && m.organizations) {
      orgId = m.org_id; canEditOrg = ['owner', 'finance'].includes(m.role);
      const o = m.organizations; logoPath = o.logo_path || null; orgName = o.name || '';
      $('o-name').value = o.name || ''; $('o-country').value = o.country || ''; $('o-country').dispatchEvent(new Event('change'));
      $('o-tax').value = o.vat_id || ''; $('o-addr').value = o.address_line || ''; $('o-zip').value = o.postal_code || '';
      $('o-city').value = o.city || ''; $('o-phone').value = o.phone || '';
    } else {
      $('org-note').textContent = 'No company is linked to this account yet. Fill in the details below and save to create it. You can then upload a logo.';
      $('org-note').hidden = false;
      canEditOrg = true;
    }
    $('logo-pick').disabled = !canEditOrg || !orgId;
    paintAvatar();
    if (!canEditOrg) {
      $('f-org').querySelectorAll('input, select, button').forEach((el) => { el.disabled = true; });
      if (orgId) { $('org-note').textContent = 'Only the account owner or finance role can edit company details.'; $('org-note').hidden = false; }
    }
    $('main').hidden = false;
  }

  $('f-profile').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!$('p-name').value.trim()) return say('m-profile', 'Enter your name.', 'err');
    say('m-profile', 'Saving...');
    const { error } = await sb.from('profiles').upsert({ user_id: user.id, full_name: nz($('p-name').value), phone: nz($('p-phone').value), updated_at: new Date().toISOString() });
    say('m-profile', error ? 'Could not save: ' + error.message : 'Saved.', error ? 'err' : 'ok');
  });

  $('f-org').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!canEditOrg) return;
    if (!$('o-name').value.trim()) return say('m-org', 'Enter the company name.', 'err');
    if (!$('o-country').value) return say('m-org', 'Select a country.', 'err');
    say('m-org', 'Saving...');
    if (!orgId) {
      const { data: id, error: ce } = await sb.rpc('create_my_org', {
        p_name: $('o-name').value.trim(), p_country: $('o-country').value, p_vat_id: nz($('o-tax').value), p_address_line: nz($('o-addr').value),
        p_city: nz($('o-city').value), p_postal_code: nz($('o-zip').value), p_phone: nz($('o-phone').value)
      });
      if (ce) return say('m-org', 'Could not create company: ' + ce.message, 'err');
      orgId = id; orgName = $('o-name').value.trim(); $('org-note').hidden = true; $('logo-pick').disabled = false; paintAvatar();
      return say('m-org', 'Company created. You can now upload a logo.', 'ok');
    }
    const { data, error } = await sb.from('organizations').update({
      name: $('o-name').value.trim(), country: $('o-country').value, vat_id: nz($('o-tax').value), address_line: nz($('o-addr').value),
      postal_code: nz($('o-zip').value), city: nz($('o-city').value), phone: nz($('o-phone').value)
    }).eq('id', orgId).select('id');
    if (error) say('m-org', 'Could not save: ' + error.message, 'err');
    else if (!data || !data.length) say('m-org', 'Not saved: you do not have permission to edit this company.', 'err');
    else { orgName = $('o-name').value.trim(); paintAvatar(); say('m-org', 'Saved.', 'ok'); }
  });

  $('f-pw').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = $('n-pw').value;
    if (password.length < 8) return say('m-pw', 'Use at least 8 characters.', 'err');
    const { error } = await sb.auth.updateUser({ password });
    if (error) return say('m-pw', error.message, 'err');
    $('n-pw').value = ''; say('m-pw', 'Password changed.', 'ok');
  });

  load();
</script>
</body>
</html>
