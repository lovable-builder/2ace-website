name: Uptime

# Checks the live site every 15 minutes (pages, config.js, database API, Edge Functions). A failed run is emailed by GitHub
# to whoever last changed this schedule. GitHub pauses scheduled runs after 60 days without any commit to the repository.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/uptime.mjs https://2ace.pl
